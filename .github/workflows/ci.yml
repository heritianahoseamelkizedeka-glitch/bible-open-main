name: CI

on:
  push:
    branches:
      - main
      - phase-1-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portal
        run: npm run build

      - name: Audit production dependency tree
        run: npm audit --audit-level=high
