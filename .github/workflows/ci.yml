name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test registry contract
        run: npm test

      - name: Validate PowerShell launcher syntax
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content 'Launcher/Web/launch-app.ps1' -Raw))
          $null = [scriptblock]::Create((Get-Content 'Launcher/Web/stop-app.ps1' -Raw))
          $null = [scriptblock]::Create((Get-Content 'Launcher/Web/core-readiness.ps1' -Raw))

      - name: Build portal
        run: npm run build

      - name: Audit production dependency tree
        run: npm audit --audit-level=high
